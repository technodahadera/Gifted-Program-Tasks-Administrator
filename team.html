main{max-width:1380px;margin:auto;padding:28px 26px 72px}.hero{background:linear-gradient(110deg,var(--navy),#214b64);border-radius:24px;color:#fff;padding:36px 42px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;overflow:hidden;margin-bottom:24px}.hero:after{content:"";position:absolute;left:-30px;bottom:-60px;width:340px;height:260px;border:42px solid rgba(103,186,214,.15);border-radius:100%;pointer-events:none}.hero h1{margin:5px 0;font-size:clamp(26px,3vw,38px);line-height:1.25}.hero p{margin:6px 0 0;color:#d8e6f0;max-width:690px}.hero .eyebrow{color:#90d6e9;font-weight:700;font-size:13px}.hero-side{font-size:13px;color:#dde9f2;white-space:nowrap}.hero-side strong{display:block;color:#fff;font-size:17px}.hero-side .hero-info{margin-top:10px;font-size:12px;color:#a7d6e8}
.login-shell{min-height:65vh;display:grid;place-items:center}.login{width:min(100%,520px);background:#fff;padding:38px;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.login-icon{font-size:26px;background:var(--blue-bg);border-radius:15px;width:61px;height:61px;display:grid;place-items:center;color:var(--blue)}.login h1{font-size:27px;margin:19px 0 5px}.login p{color:var(--muted);margin:0 0 23px}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-size:13px;font-weight:700;color:#35536b}.field input,.field select,.field textarea{border:1px solid #cfdae4;border-radius:11px;background:white;color:var(--ink);padding:12px 13px;min-width:0;width:100%;outline:none}.field textarea{resize:vertical;min-height:78px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #cde9fa}.password-line{display:flex;gap:8px;align-items:center}.password-line input{flex:1}.password-line button{border:1px solid var(--line);border-radius:10px;background:#f8fafc;padding:11px;color:#466176}.help{font-size:12px;color:#73869a;margin-top:15px;line-height:1.7}.alert{border-radius:12px;padding:12px 15px;margin:12px 0;font-size:13px}.alert.error{background:var(--red-bg);color:#8c292d;border:1px solid #f0c2bf}.alert.info{background:var(--blue-bg);color:#265c79;border:1px solid #cbe4f2}.btn{border:0;border-radius:11px;padding:11px 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;min-height:44px;text-decoration:none}.btn.primary{color:white;background:#347fa9;box-shadow:0 5px 11px #347fa92b}.btn.primary:hover{background:#276e95}.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:#1f7056}.btn.ghost{color:#40627a;background:#edf3f7}.btn.light{background:#fff;color:#385d76;border:1px solid #cadbe7}.btn.full{width:100%}.btn.small{min-height:37px;padding:8px 12px;font-size:12px}

n-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}.task-actions{display:flex;gap:8px;flex-wrap:wrap}.subtle{font-size:12px;color:#889aaa}.task-extra{margin-top:14px;background:#f8fafc;border:1px solid #e4ebf1;border-radius:12px;padding:18px;display:grid;gap:12px}.task-extra h4{font-size:14px;margin:0}.range-wrap{display:flex;align-items:center;gap:18px}.range-wrap input{flex:1;accent-color:#3289b5;min-width:40px}.range-wrap output{min-width:50px;text-align:center;font-weight:800;font-size:20px}.task-extra .field{margin:0}.history{border-top:1px solid var(--line);padding-top:15px;margin-top:3px}.history-item{padding:10px 0;border-bottom:1px solid #e9eef2;font-size:12px}.history-item b{color:#315872}.history-item time{color:#91a3b0;margin-right:8px}.history-item p{margin:4px 0;color:#526d82}.empty{text-align:center;padding:65px 20px;border:1px dashed #c9d9e4;border-radius:16px;background:#f9fbfc;color:#7890a2}.empty b{display:block;font-size:20px;color:#3b607b;margin:12px 0 5px}.empty .symbol{font-size:38px}.footer{padding:22px;text-align:center;color:#91a3b3;font-size:12px}
.toast{position:fixed;bottom:24px;left:24px;z-index:99;background:#163a51;color:white;border-radius:13px;padding:14px 20px;box-shadow:0 8px 32px #0003;max-width:min(480px,90vw);font-size:14px}.toast.bad{background:#902d31}

<script>
/* GitHub Pages -> Apps Script HTML bridge. Does not require Google OAuth in the browser. */
(() => {
'use strict';
const C=window.TECHNODA_CONFIG, SESSION_KEY='technoda_team_session_v1';
let session=null,frame=null,bridgeWindow=null,bridgeOrigin=null,ready=null,pending=new Map(),counter=0;
const STAFF=C.staff;
const makeId=p=>p+'-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
const setupReady=()=>/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(C.appsScriptUrl||'');
function isTrusted(origin){try{const u=new URL(origin);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.googleusercontent.com'));}catch{return false;}}
function belongsToBridge(source){
  if(!frame||!source)return false;
  try{
    const outer=frame.contentWindow;
    if(source===outer)return true;
    for(let i=0;i<outer.frames.length;i++){
      const inner=outer.frames[i];if(source===inner)return true;
      try{for(let j=0;j<inner.frames.length;j++)if(source===inner.frames[j])return true;}catch{}
    }
  }catch{}
  return false;
}
function onMessage(e){
  if(!frame||!belongsToBridge(e.source)||!isTrusted(e.origin)||!e.data||e.data.channel!=='technoda-bridge')return;
  if(e.data.kind==='ready'){bridgeWindow=e.source;bridgeOrigin=e.origin;if(ready?.resolve){ready.resolve();ready.resolve=null;}return;}
  if(e.source!==bridgeWindow)return;
  if(e.data.kind==='response'){
    const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);clearTimeout(p.timeout);
    if(e.data.ok)p.resolve(e.data.result);else p.reject(new Error(e.data.error||'פעולת השרת נכשלה'));
  }
}
window.addEventListener('message',onMessage);
function getBridge(){
 if(!setupReady())return Promise.reject(new Error('יש להגדיר את כתובת Apps Script בקובץ config.js.'));
 if(ready)return ready.promise;
 ready={resolve:null,promise:null};
 ready.promise=new Promise((resolve,reject)=>{
    ready.resolve=resolve;
    frame=document.createElement('iframe');frame.src=C.appsScriptUrl;frame.style.display='none';frame.title='חיבור נתונים';frame.setAttribute('aria-hidden','true');document.body.appendChild(frame);
    let attempts=0;const ticker=setInterval(()=>{
       if(!ready?.resolve){clearInterval(ticker);return;}
       if(++attempts>24){clearInterval(ticker);ready=null;reject(new Error('לא ניתן ליצור קשר עם Apps Script. יש לפרוס את קובצי הגשר כ-Web App ולהגדיר את כתובת GitHub המותרת.'));return;}
       try{frame.contentWindow.postMessage({channel:'technoda-bridge',kind:'hello'},'*');for(let i=0;i<frame.contentWindow.frames.length;i++)frame.contentWindow.frames[i].postMessage({channel:'technoda-bridge',kind:'hello'},'*');}catch{}
    },500);
 });
 return ready.promise;
}
async function rpc(action,data={}){
 await getBridge();const id=++counter;
 return new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('השרת לא הגיב בזמן. יש לבדוק את חיבור האינטרנט או את פריסת Apps Script.'));},40000);
   pending.set(id,{resolve,reject,timeout});
   bridgeWindow.postMessage({channel:'technoda-bridge',kind:'request',id,action,data,token:session?.token||''},bridgeOrigin);
 });
}
async function connect({actorId,pin}){
 const data=await rpc('login',{actorId,pin});session={token:data.token,profile:data.profile,role:data.role};
 sessionStorage.setItem(SESSION_KEY,JSON.stringify(session));return data;
}
async function restore(){
 try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return null;
 session=JSON.parse(raw);const v=await rpc('whoami');session.profile=v.profile;session.role=v.role;return v;
 }catch(e){disconnect();return null;}
}
function disconnect(){session=null;sessionStorage.removeItem(SESSION_KEY);}
const role=()=>session?.role||'guest';
const profile=()=>session?.profile||null;
const isManager=()=>role()==='manager';
const staffMember=()=>STAFF.find(x=>x.id===profile()?.memberId)||null;
const authorized=()=>!!session;
const initialize=()=>rpc('verify');
const loadData=()=>rpc('snapshot');
const loadGantt=()=>rpc('gantt');
const createTask=payload=>rpc('createTask',{payload});
const editTask=(task,fields)=>rpc('editTask',{taskId:task.id,fields});
const addAssignees=(taskId,ids)=>rpc('addAssignees',{taskId,ids});
const updateAssignment=(assignment,changes)=>rpc('updateAssignment',{assignmentId:assignment.id,changes});
const addUpdate=payload=>rpc('addUpdate',{payload});
const approve=(assignment,approved,note)=>rpc('approve',{assignmentId:assignment.id,approved,note});
async function uploadFile(file,taskId,assignmentId=''){
 if(file.size>C.uploadMaxSizeMb*1024*1024)throw new Error(`גודל הקובץ המרבי הוא ${C.uploadMaxSizeMb}MB`);
 const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});
 return rpc('upload',{taskId,assignmentId,name:file.name,mimeType:file.type||'application/octet-stream',base64});
}
window.TECHNODA_SHEETS={setupReady,connect,restore,disconnect,role,profile,staffMember,isManager,authorized,initialize,loadData,loadGantt,createTask,editTask,addAssignees,updateAssignment,addUpdate,approve,uploadFile,makeId};
})();

</script>
<script>
(()=>{
'use strict';
const CFG=window.TECHNODA_CONFIG, API=window.TECHNODA_SHEETS;
const $=(s,scope=document)=>scope.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={todo:'טרם בוצע',in_progress:'בתהליך',submitted:'ממתין לאישור המנהל',approved:'אושר והושלם',returned:'הוחזר לטיפול'};
const priorities={critical:'דחיפות קריטית',high:'דחיפות גבוהה',medium:'דחיפות בינונית',low:'דחיפות רגילה'};
const data={user:null,tasks:[],assignments:[],updates:[],approvals:[],files:[],connected:false,busy:false,filter:'all',search:'',expanded:new Set(),drafts:new Map(),lastUpdated:null};
const root=$('#root'),conn=$('#connection');
const today=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`;};
function normalizeDate(s){s=String(s||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const p=s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);return p?`${p[3]}-${p[2].padStart(2,'0')}-${p[1].padStart(2,'0')}`:'';}
function fmtDate(s){const v=normalizeDate(s);if(!v)return s||'לא נקבע';return new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v+'T12:00:00'));}
function fmtTime(s){const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function connection(text,mode=''){conn.className='connection '+mode;conn.querySelector('span').textContent=text;}
let toastTimer;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast'+(error?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),5800);}
function errorFor(e){const m=String(e?.message||e||'שגיאה לא ידועה');if(m.includes('סיסמה'))return m;return m;}
function switchHeader(on){$('#logout').classList.toggle('hidden',!on);$('#refresh').classList.toggle('hidden',!on);}
function loginScreen(message=''){
 switchHeader(false);connection('כניסה אישית');
 root.innerHTML=`<div class="login-shell"><div class="login"><div class="login-icon">♙</div><h1>שלום לצוות ההנהלה</h1><p>כל אחת ואחד רואים את המשימות שלהם, ומעדכנים את המנהל ישירות מכאן.</p>${message?`<div class="alert error" role="alert">${escapeHTML(message)}</div>`:''}<form id="login-form" autocomplete="on"><div class="field"><label for="staff">מי נכנס/ת למערכת?</label><select name="actorId" id="staff" required><option value="">בחרו את השם שלכם</option>${CFG.staff.map(p=>`<option value="${escapeHTML(p.id)}">${escapeHTML(p.name)} · ${escapeHTML(p.role)}</option>`).join('')}</select></div><div class="field"><label for="code">קוד הכניסה האישי</label><div class="password-line"><input name="pin" id="code" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="current-password" placeholder="קוד בן 4 ספרות" title="יש להזין 4 ספרות"><button type="button" id="show-code" aria-label="הצג או הסתר קוד">הצגה</button></div></div><button class="btn primary full" id="login-button" type="submit">כניסה למשימות שלי</button><div class="help">את הקוד האישי בן 4 הספרות מקבלים ממנהל התכנית. אין כאן נתונים לדוגמה: כל עדכון נשלח ל־Google Sheets ורק לאחר אישור השרת יוצג כשמור.</div></form></div></div>`;
 $('#show-code').addEventListener('click',()=>{const c=$('#code');c.type=c.type==='password'?'text':'password';$('#show-code').textContent=c.type==='password'?'הצגה':'הסתרה';});
 $('#login-form').addEventListener('submit',login);
}
async function login(ev){ev.preventDefault();if(data.busy)return;
 const frm=ev.currentTarget;const submit=$('#login-button');const values=new FormData(frm);const actorId=String(values.get('actorId')||''), pin=String(values.get('pin')||'');
 if(!actorId||!pin)return;data.busy=true;submit.disabled=true;submit.textContent='מתחבר...';connection('מתחבר ל־Google Sheets');
 try{const auth=await API.connect({actorId,pin});if(auth.role!=='staff'||auth.profile?.memberId!==actorId){API.disconnect();throw Error('יש לבחור חשבון של איש צוות בלבד.');}data.user=auth.profile;await refresh(false);switchHeader(true);}catch(e){API.disconnect();data.user=null;loginScreen(errorFor(e));}finally{data.busy=false;}
}
function latestApproval(a){return data.approvals.filter(x=>x.assignmentId===a.id).sort((x,y)=>String(y.at).localeCompare(String(x.at)))[0];}
function approvalState(a){const p=latestApproval(a);if(a.status==='submitted'&&a.completedAt&&p?.decision==='approved'&&p.submissionKey===a.completedAt)return 'approved';if(a.status==='in_progress'&&p?.decision==='returned')return 'returned';return a.status||'todo';}
function assignedTasks(){return data.assignments.map(a=>({a,t:data.tasks.find(t=>t.id===a.taskId)})).filter(x=>x.t&&x.t.archived!=='true');}
function counts(rows){return {all:rows.length,todo:rows.filter(x=>['todo','returned'].includes(approvalState(x.a))).length,in_progress:rows.filter(x=>approvalState(x.a)==='in_progress').length,submitted:rows.filter(x=>approvalState(x.a)==='submitted').length,approved:rows.filter(x=>approvalState(x.a)==='approved').length};}
function statusEl(status){return `<span class="status ${escapeHTML(status)}">${escapeHTML(names[status]||names.todo)}</span>`;}
function dueInfo(t,approved){const d=normalizeDate(t.dueDate);if(!d)return `<span class="tag">ללא תאריך יעד</span>`;const isLate=d<today()&&!approved;const isSoon=d>=today()&&d<=addDays(today(),3)&&!approved;return `<span class="tag ${isLate?'due-late':isSoon?'due-soon':''}">📅 יעד: ${escapeHTML(fmtDate(t.dueDate))}${isLate?' · באיחור':''}</span>`;}
function addDays(s,num){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+num);return d.toISOString().slice(0,10);}
function tasksForView(){const q=data.search.trim().toLowerCase();return assignedTasks().filter(x=>{
 const status=approvalState(x.a);
 if(data.filter==='open'&&!['todo','returned','in_progress'].includes(status))return false;
 if(data.filter==='waiting'&&status!=='submitted')return false;
 if(data.filter==='done'&&status!=='approved')return false;
 return !q||[x.t.title,x.t.description,x.t.managerNotes,x.a.lastNote].join(' ').toLowerCase().includes(q);
}).sort((x,y)=>{
 const rank={returned:0,todo:1,in_progress:2,submitted:3,approved:4};const a=approvalState(x.a),b=approvalState(y.a);return rank[a]-rank[b]||String(normalizeDate(x.t.dueDate)||'9999').localeCompare(String(normalizeDate(y.t.dueDate)||'9999'));
});}
function historyFor(task){return data.updates.filter(x=>x.taskId===task.id).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);}
function notesHtml(task,a){const history=historyFor(task);const ret=latestApproval(a);return `<div class="history"><h4>דיווחים והערות אחרונות</h4>${ret?.decision==='returned'&&ret.note?`<div class="special-note return-note">הערת המנהל: ${escapeHTML(ret.note)}</div>`:''}${history.length?history.map(u=>`<div class="history-item"><b>${escapeHTML(u.author||'צוות')}</b><time>${escapeHTML(fmtTime(u.date))}</time><p>${escapeHTML(u.message)}</p></div>`).join(''):'<div class="subtle" style="padding:10px 0">עדיין אין עדכונים למשימה הזאת.</div>'}</div>`;}
function taskHtml({t,a}){
 const status=approvalState(a),approved=status==='approved',submitted=status==='submitted',expanded=data.expanded.has(a.id),percent=approved||submitted?100:Math.max(0,Math.min(100,Number(a.progress)||0));
 const draft=data.drafts.get(a.id)||{progress:percent,note:''};const ptext=escapeHTML(t.description||'');
 return `<article class="task priority-${escapeHTML(t.priority||'medium')}" data-assignment="${escapeHTML(a.id)}"><div class="task-head"><div><h3>${escapeHTML(t.title)}</h3>${ptext?`<p class="description">${ptext}</p>`:''}</div>${statusEl(status)}</div><div class="tags">${dueInfo(t,approved)}<span class="tag ${['critical','high'].includes(t.priority)?'pri-high':''}">${escapeHTML(priorities[t.priority]||priorities.medium)}</span></div>${t.managerNotes?`<div class="special-note"><strong>דגשי מנהל:</strong> ${escapeHTML(t.managerNotes)}</div>`:''}${a.lastNote&&status==='in_progress'?`<div class="subtle">עדכון אחרון: ${escapeHTML(a.lastNote)}</div>`:''}<div class="progress-line"><span>התקדמות</span><div class="progress" aria-label="${percent}% ביצוע"><span style="width:${percent}%"></span></div><strong>${percent}%</strong></div><div class="task-bottom"><div class="task-actions">${!approved&&!submitted?`<button type="button" class="btn green small" data-action="done" data-id="${escapeHTML(a.id)}">✓ בוצע · שלח לאישור</button><button type="button" class="btn ghost small" data-action="edit" data-id="${escapeHTML(a.id)}">✎ עדכון התקדמות</button>`:''}${submitted?`<span class="subtle">הדיווח נשלח וממתין להחלטת המנהל</span><button type="button" class="btn ghost small" data-action="edit" data-id="${escapeHTML(a.id)}">צפייה בהערות</button>`:''}${approved?`<span class="subtle">✓ הביצוע אושר על ידי המנהל</span><button type="button" class="btn ghost small" data-action="edit" data-id="${escapeHTML(a.id)}">צפייה בהיסטוריה</button>`:''}</div><small class="subtle">${a.updatedAt?'עודכן '+escapeHTML(fmtTime(a.updatedAt)):''}</small></div>${expanded?`<div class="task-extra"><div class="section-head" style="margin:0"><h4>${submitted||approved?'הערות ודיווחים':'דיווח ההתקדמות שלי'}</h4><button type="button" class="btn ghost small" data-action="collapse" data-id="${escapeHTML(a.id)}">סגירה ×</button></div>${!approved&&!submitted?`<form class="progress-form" data-id="${escapeHTML(a.id)}"><div class="range-wrap"><label for="range-${escapeHTML(a.id)}">אחוז ביצוע</label><input type="range" id="range-${escapeHTML(a.id)}" name="progress" min="0" max="100" step="5" value="${Math.max(0,Math.min(100,Number(draft.progress)||0))}"><output for="range-${escapeHTML(a.id)}">${Math.max(0,Math.min(100,Number(draft.progress)||0))}%</output></div><div class="field"><label for="note-${escapeHTML(a.id)}">מה התעדכן? (לא חובה)</label><textarea id="note-${escapeHTML(a.id)}" name="note" maxlength="1400" placeholder="מה כבר בוצע, האם יש קושי או מה השלב הבא?">${escapeHTML(draft.note||'')}</textarea></div><div class="task-actions"><button class="btn primary small" type="submit">שמירת התקדמות</button><button class="btn light small" type="button" data-action="notdone" data-id="${escapeHTML(a.id)}">טרם בוצע</button></div></form>`:`<div class="field"><label for="comment-${escapeHTML(a.id)}">הערה נוספת למנהל</label><textarea id="comment-${escapeHTML(a.id)}" maxlength="1400" placeholder="כתיבת עדכון נוסף..." ${approved?'disabled':''}></textarea></div>${!approved?`<button class="btn primary small" type="button" data-action="comment" data-id="${escapeHTML(a.id)}">שליחת הערה</button>`:''}`}<div class="field" style="margin-top:16px"><strong>קבצים מצורפים</strong><div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">${data.files.filter(f=>f.taskId===t.id).map(f=>`<a href="${escapeHTML(f.url)}" target="_blank" rel="noopener noreferrer" class="btn light small">📎 ${escapeHTML(f.name)} (${escapeHTML(f.uploadedBy==='manager'?'מנהל':(CFG.staff.find(s=>s.id===f.uploadedBy)?.name||'צוות'))})</a>`).join('')||'<span class="subtle">עדיין לא צורפו קבצים</span>'}</div><label>העלאת קובץ (עד 3MB)<input type="file" data-upload="${escapeHTML(a.id)}" style="display:block;margin-top:8px;max-width:100%"></label></div>${notesHtml(t,a)}</div>`:''}</article>`;
}
function render(){if(!data.user){loginScreen();return;}switchHeader(true);const rows=assignedTasks(),c=counts(rows),view=tasksForView();const name=CFG.staff.find(x=>x.id===data.user.memberId)?.name||data.user.name||'צוות';const date= new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jerusalem'}).format(new Date());
 root.innerHTML=`<section class="hero"><div><div class="eyebrow">טכנודע · תכנית המחוננים</div><h1>שלום, ${escapeHTML(name)} 👋</h1><p>כל המשימות שהוקצו לך, ההתקדמות והעדכונים למנהל — במקום אחד. אפשר לעדכן אחוז ביצוע או להגיש משימה שהושלמה לאישור.</p></div><div class="hero-side"><strong>${escapeHTML(date)}</strong><div class="hero-info">${data.lastUpdated?'רענון אחרון: '+escapeHTML(fmtTime(data.lastUpdated)):''}</div></div></section><section class="stats"><div class="stat"><div><b>${c.all}</b><small>משימות שהוקצו לי</small></div><span class="ico">▦</span></div><div class="stat orange"><div><b>${c.todo+c.in_progress}</b><small>דורשות טיפול</small></div><span class="ico">◷</span></div><div class="stat violet"><div><b>${c.submitted}</b><small>ממתינות לאישור</small></div><span class="ico">⌛</span></div><div class="stat green"><div><b>${c.approved}</b><small>אושרו והושלמו</small></div><span class="ico">✓</span></div></section><section class="work"><div class="section-head"><div><h2>המשימות שלי</h2><p>עדכון ההתקדמות כאן נשמר ב־Google Sheets ונראה גם במסך המנהל.</p></div><div class="tools"><input class="search" id="search" type="search" placeholder="חיפוש משימה..." value="${escapeHTML(data.search)}" aria-label="חיפוש משימות"></div></div><div class="tabs" aria-label="סינון משימות">${[['all','הכול'],['open','לביצוע / בתהליך'],['waiting','ממתינות לאישור'],['done','אושרו']].map(([id,label])=>`<button type="button" class="tab ${data.filter===id?'on':''}" data-action="filter" data-filter="${id}">${label}</button>`).join('')}</div><div class="tasks">${view.length?view.map(taskHtml).join(''):`<div class="empty"><span class="symbol">✓</span><b>אין כרגע משימות בסינון הזה</b><span>${rows.length?'אפשר לבחור סינון אחר.':'כשמנהל התכנית יקצה לך משימות, הן יופיעו כאן.'}</span></div>`}</div></section><div class="footer">טכנודע · מרכז משימות תכנית המחוננים · העדכונים נשמרים במערכת המשותפת</div>`;
}
async function refresh(showToast=false){if(!data.user)return;connection('מסנכרן נתונים...');try{const snap=await API.loadData();const id=data.user.memberId;if(!snap||!Array.isArray(snap.tasks)||!Array.isArray(snap.assignments))throw Error('התקבלה תשובה לא תקינה מהשרת.');const mine=snap.assignments.filter(x=>x.assigneeId===id);const ids=new Set(mine.map(x=>x.taskId));data.tasks=snap.tasks.filter(x=>ids.has(x.id));data.assignments=mine;data.updates=(snap.updates||[]).filter(x=>ids.has(x.taskId));data.approvals=(snap.approvals||[]).filter(x=>mine.some(a=>a.id===x.assignmentId));data.files=(snap.files||[]).filter(x=>ids.has(x.taskId));data.connected=true;data.lastUpdated=new Date().toISOString();connection('מחובר ל־Google Sheets','ok');render();if(showToast)toast('המשימות עודכנו מהגיליון.');}
 catch(e){data.connected=false;connection('שגיאת חיבור','bad');if(data.user){root.innerHTML=`<div class="login-shell"><div class="login"><h1>החיבור נקטע</h1><p>לא מוצגים נתונים ישנים כדי למנוע דיווחים שגויים. המידע שכבר נשמר בגיליון לא נפגע.</p><div class="alert error">${escapeHTML(errorFor(e))}</div><button type="button" class="btn primary" id="try-again">ניסיון חיבור מחדש</button></div></div>`;$('#try-again').addEventListener('click',()=>refresh(true));}if(showToast)toast(errorFor(e),true);}}
function taskByAssignment(id){const a=data.assignments.find(x=>x.id===id);if(!a)throw Error('לא נמצאה המשימה שלך. יש לרענן את המסך.');const t=data.tasks.find(x=>x.id===a.taskId);if(!t)throw Error('פרטי המשימה חסרים.');return {a,t};}
async function actionUpdate(id,changes,success){if(data.busy||!data.connected)return;const {a}=taskByAssignment(id);const status=approvalState(a);if(status==='approved'||status==='submitted')throw Error('המשימה כבר הוגשה או אושרה; אין אפשרות לשנות התקדמות כרגע.');data.busy=true;lockButtons(true);try{await API.updateAssignment(a,changes);data.drafts.delete(id);await refresh();toast(success);}catch(e){toast(errorFor(e),true);}finally{data.busy=false;lockButtons(false);}}
function lockButtons(lock){root.querySelectorAll('button, input[type=range], textarea').forEach(el=>{if(lock)el.setAttribute('disabled','disabled');else el.removeAttribute('disabled');});}
async function addComment(id){if(data.busy||!data.connected)return;const {t}=taskByAssignment(id),card=root.querySelector(`article[data-assignment="${CSS.escape(id)}"]`),note=card?.querySelector('textarea[id^="comment-"]')?.value.trim();if(!note){toast('יש לכתוב הערה לפני השליחה.',true);return;}data.busy=true;lockButtons(true);try{await API.addUpdate({taskId:t.id,message:note});await refresh();toast('ההערה נשלחה למנהל.');}catch(e){toast(errorFor(e),true);}finally{data.busy=false;lockButtons(false);}}
async function markDone(id){if(!confirm('לסמן שהמשימה בוצעה ולהגיש אותה לאישור המנהל?'))return;await actionUpdate(id,{status:'submitted',progress:100},'המשימה הוגשה למנהל לאישור.');}
function getDraftFromCard(id){const card=root.querySelector(`article[data-assignment="${CSS.escape(id)}"]`);const p=card?.querySelector('input[type="range"]');const t=card?.querySelector('textarea[name="note"]');return {progress:p?.value||'0',note:t?.value||''};}
root.addEventListener('input',e=>{const target=e.target;if(target.id==='search'){data.search=target.value;const active=target.selectionStart;render();const input=$('#search');input.focus();input.setSelectionRange(active,active);return;}
 if(target.matches('input[type="range"]')){const card=target.closest('article');card?.querySelector('output').replaceChildren(String(target.value)+'%');}
 if(target.matches('input[type="range"],textarea[name="note"]')){const card=target.closest('article');if(card)data.drafts.set(card.dataset.assignment,getDraftFromCard(card.dataset.assignment));}
});
root.addEventListener('change',async e=>{const input=e.target;if(!input.matches('input[data-upload]'))return;const file=input.files?.[0];if(!file)return;const id=input.dataset.upload;if(data.busy||!data.connected)return;try{const {t,a}=taskByAssignment(id);if(file.size>3*1024*1024)throw Error('ניתן לצרף קובץ עד 3MB בלבד.');data.busy=true;input.disabled=true;await API.uploadFile(file,t.id,a.id);await refresh();data.expanded.add(id);render();toast('הקובץ נשמר בתיקיית המשימות ויופיע גם אצל המנהל.');}catch(err){toast(errorFor(err),true);}finally{data.busy=false;if(input.isConnected)input.disabled=false;}});
root.addEventListener('submit',async e=>{const form=e.target;if(!form.matches('.progress-form'))return;e.preventDefault();const id=form.dataset.id;const draft=getDraftFromCard(id);await actionUpdate(id,{status:Number(draft.progress)>0?'in_progress':'todo',progress:Number(draft.progress),lastNote:String(draft.note||'').slice(0,1400)},'ההתקדמות נשמרה והמנהל עודכן.');});
root.addEventListener('click',async e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;
 try{if(action==='filter'){data.filter=btn.dataset.filter;render();return;}if(action==='edit'||action==='collapse'){if(action==='edit')data.expanded.add(id);else data.expanded.delete(id);render();return;}if(action==='done'){await markDone(id);return;}if(action==='notdone'){await actionUpdate(id,{status:'todo',progress:0,lastNote:'טרם בוצע'},'המשימה סומנה כטרם בוצעה.');return;}if(action==='comment'){await addComment(id);}}
 catch(err){toast(errorFor(err),true);}
});
$('#refresh').addEventListener('click',()=>refresh(true));$('#logout').addEventListener('click',()=>{API.disconnect();data.user=null;data.connected=false;data.expanded.clear();data.drafts.clear();loginScreen();toast('התנתקת מהמערכת.');});
async function boot(){loginScreen();try{const restored=await API.restore();if(restored?.role==='staff'&&CFG.staff.some(s=>s.id===restored.profile?.memberId)){data.user=restored.profile;await refresh();}else if(restored){API.disconnect();}}catch(e){API.disconnect();}}
boot();
setInterval(()=>{if(data.user&&data.connected&&!data.busy&&document.visibilityState==='visible'&&!root.querySelector('.task-extra'))refresh(false);},60000);
})();
</script>
</body>
</html>
