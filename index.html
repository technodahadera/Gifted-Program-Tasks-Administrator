/* Manager v3: readable overview, actionable warnings, scrollable task form. */
#task-form{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;overflow:hidden}
#task-form>.modal-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
#task-form>.modal-footer{position:relative;z-index:2;flex:0 0 auto;box-shadow:0 -4px 16px rgba(10,40,55,.055)}
.modal-layer{align-items:center;overflow:hidden}
.modal{max-height:min(760px,calc(100dvh - 30px));min-height:0}

.modal-header{flex:0 0 auto}

.import-label:hover{background:rgba(255,255,255,.12)}
.alert-section,.overview-panel{padding:23px;margin-bottom:21px}
.alert-section .section-header,.overview-panel .section-header{margin-bottom:15px}
.alert-count{background:#fff0ed;color:#be3e45}
.alert-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.alert-item{background:#fff;border:1px solid #e5edf1;border-right:5px solid #f2b061;border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;min-width:0}
.alert-main,.alert-side{display:flex;align-items:center;gap:12px;min-width:0}.alert-main>div{min-width:0}
.alert-main strong{display:block;font-size:12px;line-height:1.5}.alert-main small{display:block;color:#80909d;margin-top:6px;font-size:10px;line-height:1.4}
.alert-side{flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;gap:9px}
.alert-time{font-size:11px;font-weight:700;white-space:nowrap}.alert-date{font-size:10px;color:#7b8b98;white-space:nowrap}
.alert-symbol{color:#d67a38;background:#fff3e4;padding:9px;border-radius:10px}
.pulse-late{border-color:#e98e8f!important;border-right-color:#cf3d43!important;background:#fff4f4!important;animation:pulseDeadline 1s ease-in-out infinite alternate}
.pulse-today{border-color:#f0a8a1!important;border-right-color:#e2634b!important;background:#fff7f3!important;animation:pulseDeadline 1.2s ease-in-out infinite alternate}
.pulse-critical{border-color:#f1b98a!important;border-right-color:#ec8e30!important;background:#fffaf1!important;animation:pulseSoft 1.8s ease-in-out infinite alternate}
.pulse-soon{border-color:#f0dfb8!important;border-right-color:#e6ae4b!important;background:#fffcf5!important;animation:pulseSoft 3s ease-in-out infinite alternate}
.alert-item.pulse-late .alert-time,.alert-item.pulse-today .alert-time,.alert-item.pulse-critical .alert-time{color:#c64f43}
@keyframes pulseDeadline{from{box-shadow:0 0 0 rgba(214,65,55,0)}to{box-shadow:0 0 0 3px rgba(214,65,55,.12),0 4px 17px rgba(214,65,55,.14)}}
@keyframes pulseSoft{from{box-shadow:0 0 0 rgba(232,163,57,0)}to{box-shadow:0 0 0 2px rgba(232,163,57,.085),0 3px 11px rgba(232,163,57,.12)}}
.overview-scroll{overflow:auto;max-height:570px;scrollbar-color:#dce6ed transparent}

.overview-table th{position:sticky;top:0;z-index:1;background:#f5f8fa;color:#5d7081;font-size:11px;font-weight:600;padding:13px 12px;border-bottom:1px solid #e6edf2}
.overview-table td{padding:12px;border-bottom:1px solid #edf1f4;vertical-align:middle;line-height:1.55}
.overview-table tr:hover td{background:#f8fbfc}
.overview-table small{display:block;margin-top:5px;color:#8295a3;font-size:10px}.overview-table .due-danger{color:#d45a4e;font-weight:600}
.overview-table .status{white-space:nowrap}.table-link{display:block;border:0;background:none;padding:0;font-size:12px;text-align:right;font-weight:650;color:#296f91;white-space:normal}
.table-link:hover{text-decoration:underline}

.inline-extend{display:flex;align-items:center;gap:6px;white-space:nowrap}.inline-extend input{border:1px solid #d9e6ed;background:#fff;border-radius:8px;padding:7px 5px;font-size:10px;min-width:115px;max-width:130px}

function tripCellValue(cell){if(!cell)return '';const x=cell.f??cell.v??'';return String(x).trim();}
function parseTripDate(cell){if(!cell)return '';
 const v=String(cell.v??'').trim(),f=String(cell.f??'').trim();
 for(const x of [v,f]){
  const d=x.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
  if(d)return `${d[1]}-${String(Number(d[2])+1).padStart(2,'0')}-${String(Number(d[3])).padStart(2,'0')}`;
  const z=x.match(/^(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})$/);
  if(z){const year=Number(z[3])<100?2000+Number(z[3]):Number(z[3]);if(Number(z[2])<=12&&Number(z[1])<=31)return `${year}-${z[2].padStart(2,'0')}-${z[1].padStart(2,'0')}`;}
  if(/^\d{4}-\d{2}-\d{2}$/.test(x))return x;
 }
 return '';
}
function readTripSheetResponse(result){
 if(!result?.table?.rows||result.status==='error')throw new Error(result?.errors?.[0]?.message||'גיליון הטיולים לא השיב נתונים תקינים');
 const trips=[];
 for(const [i,item] of result.table.rows.entries()){
  const cells=item.c||[],dateCell=cells[4],date=parseTripDate(dateCell);
  const row={row:i+1,date};
  for(let n=0;n<TRIP_FIELDS.length;n++)if(n!==3)row[TRIP_FIELDS[n]]=tripCellValue(cells[n+1]);
  if(row.grade||row.place||date) {if(row.grade!=='שכבה' && row.place!=='מיקום' && row.status!=='סטטוס')trips.push(row);}
 }
 if(!trips.some(t=>t.date))throw new Error('לא נמצאו תאריכי טיולים בנתוני הגיליון');
 return trips;
}

let tripFetchPending=null;
function refreshTripsFromSheet({showToast=false}={}){
 if(tripFetchPending)return tripFetchPending;
 state.tripLoading=true;
 tripFetchPending=new Promise((resolve,reject)=>{
  const callback='__technodaTripSheetCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const tag=document.createElement('script');let finished=false;
  let timeout;
  function finish(error,trips){if(finished)return;finished=true;clearTimeout(timeout);try{delete window[callback];}catch{}tag.remove();error?reject(error):resolve(trips);}
  window[callback]=resp=>{try{finish(null,readTripSheetResponse(resp));}catch(e){finish(e);}};
  tag.onerror=()=>finish(new Error('לא ניתן לטעון את גיליון הטיולים דרך Google Visualization.'));
  const tqx=encodeURIComponent('out:json;responseHandler:'+callback);
  tag.src=`https://docs.google.com/spreadsheets/d/${TRIP_SHEET_ID}/gviz/tq?gid=${TRIP_SHEET_GID}&headers=0&tqx=${tqx}&nocache=${Date.now()}`;
  timeout=setTimeout(()=>finish(new Error('חלף זמן ההמתנה לנתוני הטיולים')),15000);
  document.head.appendChild(tag);
 }).then(trips=>{state.trips=trips;state.tripSource='live';state.tripError='';state.tripLastUpdated=new Date();state.tripLoading=false;if(!['create','edit','personal'].includes(state.modal))render();if(showToast)toast('טיולים עודכנו מגיליון תשפ״ז');return trips;}).catch(error=>{state.tripSource=state.tripSource==='live'?'live':'snapshot';state.tripError=error.message;state.tripLoading=false;if(!['create','edit','personal'].includes(state.modal))render();if(showToast)toast('לא התקבל עדכון חי לטיולים. מוצגים נתוני הגיבוי.',true);console.warn('Technoda trips live sync unavailable:',error);return state.trips;}).finally(()=>{tripFetchPending=null;});
 return tripFetchPending;
}

const GANTT_WEEKDAYS={'ראשון':0,'שני':1,'שלישי':2,'שישי':5};
function monthProgrammeDates(month,day){
 const [year,mon]=month.split('-').map(Number),last=new Date(year,mon,0).getDate(),weekday=GANTT_WEEKDAYS[day];

 const result=[];
 for(let n=1;n<=last;n++){
   const d=new Date(year,mon-1,n,12);
   if(d.getDay()===weekday)result.push(`${year}-${String(mon).padStart(2,'0')}-${String(n).padStart(2,'0')}`);
 }
 return result;
}

 }).join(''):`<tr><td colspan="5" class="overview-empty">${state.showArchived?'אין משימות בארכיון.':'אין משימות בסינון שנבחר.'}</td></tr>`}</tbody></table></div>${all.length>150?'<p class="table-footnote">מוצגות 150 המשימות הראשונות. ניתן לסנן לפי אחראי, מצב או חיפוש.</p>':''}<p class="unified-table-hint">לשינוי תאריך יעד, הקצאת עובדים ואישור ביצוע לחצו על <strong>פרטים / אישור</strong> או <strong>עריכה</strong>. הסרה מעבירה משימה לארכיון וניתנת לשחזור.</p></section>`;

function submitPersonalTask(form){
 if(!canManagePersonalTasks())return;
 const data=new FormData(form);
 const title=String(data.get('title')||'').trim();
 const dueDate=String(data.get('dueDate')||'');
 if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(dueDate)){
  toast('יש למלא שם משימה ותאריך יעד תקין.',true);
  return;
 }
 const tasks=readPersonalTasks();
 const old=tasks.find(t=>t.id===state.selected);
 if(state.selected&&!old){
  toast('המשימה נמחקה בחלון אחר. יש לסגור את הטופס ולפתוח משימה חדשה.',true);
  return;
 }
 const reminderInput=String(data.get('reminderAt')||'');
 const reminderDate=reminderInput?new Date(reminderInput):null;
 if(reminderDate&&(Number.isNaN(reminderDate.getTime())||personalDateTimeInput(reminderDate)!==reminderInput)){
  toast('יש לבחור תאריך ושעה תקינים לתזכורת.',true);
  return;
 }
 const reminderAt=reminderDate?.toISOString()||'';
 const task={
  id:old?.id||API.makeId('personal'),
  personal:true,
  title,
  description:String(data.get('description')||'').trim(),
  dueDate,
  reminderAt,
  reminderSeen:old?.reminderAt===reminderAt&&!!old.reminderSeen,
  completed:data.has('completed')
 };
 savePersonalTasks(old?tasks.map(t=>t.id===old.id?task:t):[...tasks,task]);
 state.modal='';
 if(!old||old.dueDate!==dueDate){
  state.month=dueDate.slice(0,7);

 }
 render();

}

   const removing=action==='archiveTask';
   if(!confirm(removing?`להסיר את המשימה "${task.title}" מהלוח? היא תועבר לארכיון, תישאר בגיליון Google Sheets וניתן יהיה לשחזר אותה.`:`להחזיר את המשימה "${task.title}" ללוח הפעיל?`))return;
   await mutate(async()=>{await API.editTask(task,{archived:removing?'true':'false'});},removing?'המשימה הועברה לארכיון וניתן לשחזר אותה.':'המשימה שוחזרה ללוח הפעיל.');return;
 }
 if(action==='managerCompleteApprove'){
   if(!isManager())return;
   const a=state.data.assignments.find(x=>x.id===el.dataset.assignment);if(!a||isApproved(a))return;
   const task=state.data.tasks.find(t=>t.id===a.taskId);
   if(!confirm(`אישור מטעם המנהל: האם "${a.assigneeName||person(a.assigneeId).name}" השלים/ה את המשימה "${task?.title||''}"? פעולה זו תסמן 100% ביצוע ותאשר אותו ללא הגשה מצד איש הצוות.`))return;
   await mutate(async()=>{
     if(a.status!=='submitted')await API.updateAssignment(a,{status:'submitted',progress:100});
     await API.approve(a,true,'אושר ישירות על ידי מנהל התכנית');
   },'הביצוע סומן כהושלם ואושר על ידי המנהל.');return;
 }
 if(action==='exportData'){exportBackup();return;}
 if(action==='extend'){await extendDeadline(el.dataset.task);return;}
 if(action==='login'){return;}
 if(action==='logout'){return;}
 if(action==='initialize'){await mutate(async()=>{await API.initialize();},'מבנה הגיליון הוכן. אפשר להתחיל!');return;}
 if(action==='refresh'){
   if(window.technodaManualRefreshPending)return;
   window.technodaManualRefreshPending=true;
   const button=el;
   const previousTitle=button.title;
   button.disabled=true;
   button.title='מעדכן נתונים מ-Google Sheets…';
   button.setAttribute('aria-busy','true');
   button.style.opacity='0.55';
   button.style.cursor='wait';
   toast('מעדכן עכשיו את המשימות והטיולים מ-Google Sheets…');
   void refreshTripsFromSheet();
   try{
     await Promise.race([
       refresh(false),
       new Promise((_,reject)=>setTimeout(()=>reject(new Error('השרת לא השיב בתוך 25 שניות. בדוק את החיבור ונסה שוב.')),25000))
     ]);
     toast('המשימות עודכנו בהצלחה מ-Google Sheets · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
   }catch(err){
     toast('הרענון נכשל: '+(err?.message||String(err)),true);
   }finally{
     window.technodaManualRefreshPending=false;
     const current=document.querySelector('[data-action="refresh"]');
     if(current){current.disabled=false;current.removeAttribute('aria-busy');current.style.opacity='';current.style.cursor='';current.title=previousTitle||'רענון תצוגה';}
   }
   return;
 }
 if(action==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();return;}
 if(action==='teamFilter'){state.filter=el.dataset.value;render();return;}
 if(action==='managerFilter'){state.managerFilter=el.dataset.value;render();return;}
 if(action==='roster'){if(state.page==='manager'){state.managerFilter=el.dataset.value;window.scrollTo({top:380,behavior:'smooth'});}else state.filter='mine';render();return;}
 if(action==='monthPrev'){changeMonth(-1);return;}if(action==='monthNext'){changeMonth(1);return;}
 if(action==='ganttFull'){state.modal='gantt';render();return;}
 if(action==='create'){state.selected=null;state.prefillDate='';state.modal='create';render();return;}
 if(action==='createOnDate'){state.selected=null;state.prefillDate=el.dataset.date||'';state.modal='create';render();return;}
 if(action==='ganttToday'){state.month=nowMonth;render();document.getElementById('main-gantt')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(action==='jumpToMonth'){state.month=el.dataset.month||nowMonth;state.day='all';state.modal='';render();document.getElementById('main-gantt')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(action==='edit'){state.selected=el.dataset.task;state.modal='edit';render();return;}
 if(action==='detail'){state.selected=el.dataset.task;state.modal='detail';render();return;}
 if(action==='closeLayer'||action==='closeModal'){state.modal='';render();return;}
 if(action==='start'||action==='submit'){await updateAssignmentFlow(el.dataset.assignment,action);return;}
 if(action==='approve'||action==='return'){await approveFlow(el.dataset.assignment,action==='approve');return;}
}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='closeLayer'&&e.target!==el)return;e.preventDefault();try{await onAction(el);}catch(err){toast(err.message,true);}});
document.addEventListener('submit',e=>{
 if(e.target.id!=='personal-task-form')return;
 e.preventDefault();
 try{submitPersonalTask(e.target);}catch(error){toast(error.message,true);}
});
document.addEventListener('submit',async e=>{if(!['task-form','update-form','progress-form','login-form'].includes(e.target.id))return;e.preventDefault();if(state.busy)return;try{if(e.target.id==='login-form'){const d=new FormData(e.target);const login=await API.connect({actorId:String(d.get('actorId')),pin:String(d.get('pin'))});state.user=login.profile;state.role=login.role;state.mode='live';state.modal='';await refresh(true);}else if(e.target.id==='task-form')await submitTaskForm(e.target);else if(e.target.id==='update-form')await submitUpdate(e.target);else await submitProgress(e.target);}catch(err){toast(err.message,true);}});
document.addEventListener('change',e=>{if(e.target.id==='demo-person'){state.demoUser=e.target.value;render();}if(e.target.id==='day-picker'){state.day=e.target.value;render();}if(e.target.id==='manager-person'){state.managerFilter=e.target.value;render();}if(e.target.id==='detail-upload')fileUpload(e.target);if(e.target.id==='import-data')importBackup(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){state.search=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal='';render();}});
window.addEventListener('storage',e=>{
 if(e.key!==PERSONAL_TASKS_KEY&&e.key!==null)return;
 personalTasks=readPersonalTasks();
 if(!state.modal&&!document.activeElement?.matches('input, textarea, select, [contenteditable]'))render();
 else renderPersonalReminders();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderPersonalReminders();});
setInterval(renderPersonalReminders,1000);
// Manager login is automatic. Never silently switch to local mode on connection failure.
async function startManagerLive(){
  state.mode='live';
  state.connectionConfirmed=false;
  state.connectionError='';
  state.data=blankData();
  state.user={name:'מנהל התכנית'};
  state.role='manager';
  state.updatedAt=new Date();
  render();
  try{
    let result;
    try{result=await API.restore();}catch(e){result=null;}
    if(!result || result.role!=='manager')result=await API.connect({actorId:'manager',pin:''});
    state.user=result.profile;
    state.role=result.role;
    await refresh();
    if(state.data.needsInit)toast('מבנה הגיליון דורש אתחול. אין להוסיף משימות לפני בדיקת החיבור.',true);
  }catch(e){
    state.data=blankData();
    state.data.needsInit=false;
    state.connectionConfirmed=false;
    state.connectionError=e.message;
    state.role='guest';
    render();
    toast('החיבור ל-Google Sheets נכשל: '+e.message,true);
  }
}
// Refresh live task data every minute without reloading the page.
// Avoid overwriting open forms or interrupting an in-progress edit.
let technodaAutoRefreshBusy=false;
setInterval(async()=>{
  if(document.hidden || technodaAutoRefreshBusy || state.busy || state.mode!=='live' ||
     state.role!=='manager' || !state.connectionConfirmed || state.modal ||
     document.activeElement?.matches('input, textarea, select, [contenteditable]')) return;
  technodaAutoRefreshBusy=true;
  try { await refresh(false,true); }
  catch(error) { console.warn('Technoda background refresh failed:',error); }
  finally { technodaAutoRefreshBusy=false; }
},60000);
void refreshTripsFromSheet();
setInterval(()=>{if(!document.hidden && !state.busy)void refreshTripsFromSheet();},300000);
try {
  const startup = startManagerLive();
  if (startup && typeof startup.catch === 'function') startup.catch(showStartupFailure);
} catch (error) { showStartupFailure(error); }
function showStartupFailure(error) {
  console.error('Technoda manager startup error:', error);
  const root=document.getElementById('app');
  if(!root)return;
  root.innerHTML='';
  const panel=document.createElement('section');
  panel.style.cssText='direction:rtl;max-width:800px;margin:60px auto;padding:30px;background:white;color:#17354a;border:2px solid #cbd5e1;border-radius:18px;font:18px Rubik,Arial,sans-serif;line-height:1.8';
  const heading=document.createElement('h1');heading.textContent='ניהול המשימות של טכנודע';panel.appendChild(heading);
  const info=document.createElement('p');info.textContent='המערכת נתקלה בשגיאה בעת טעינת המסך. לא בוצע שינוי בנתוני המשימות.';panel.appendChild(info);
  const detail=document.createElement('pre');detail.style.cssText='white-space:pre-wrap;direction:ltr;text-align:left;font:14px monospace;background:#f1f5f9;padding:16px;border-radius:10px';detail.textContent=String(error&&error.stack||error);panel.appendChild(detail);
  root.appendChild(panel);
}
})();
</script>
